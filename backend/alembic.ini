# Alembic configuration for the Task Management backend.
#
# The database URL is deliberately NOT stored here. alembic/env.py reads it from
# app/core/config.py, which loads backend/.env (git-ignored). This file is
# committed, so it must never contain a password.
#
# Usage (from backend/, with the venv active):
#   alembic current                    # development database (DATABASE_URL)
#   alembic -x db=test upgrade head    # test database (TEST_DATABASE_URL)

[alembic]
# Folder with env.py, script.py.mako and versions/ (relative to this file).
script_location = %(here)s/alembic

# Lets env.py import the "app" package even without "pip install -e".
prepend_sys_path = .

# Use the operating system's path separator in path lists below.
path_separator = os

# Migration file names: <revision id>_<message slug>.py, e.g. 0001_initial_schema.py
# (the revision id is chosen with --rev-id when creating a migration).
# Migration file names: <UTC date>_<time>-<revision id>_<message slug>.py,
# e.g. 2026_11_18_1227-0001_initial_schema.py, so files sort in creation order.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timestamps written into new migration files use UTC, like the database (P-1).
timezone = UTC


[post_write_hooks]
# Every newly generated migration is cleaned up automatically:
# imports sorted, then formatted, using the project's ruff settings (pyproject.toml).
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --select I REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# No [loggers]/[handlers]/[formatters] sections: env.py uses the application's
# logging setup (app/core/logging.py), so Alembic output has the same format and
# the same secret redaction as the API.